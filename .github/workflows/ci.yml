# Continuous integration: lint + tests on every push and pull request.
#
# Security notes (these are deliberate - see PLAN.md Phase 6 study topics):
#   * `permissions: contents: read` - the default GITHUB_TOKEN can write to the
#     repo; this job only needs to read it (principle of least privilege).
#   * Third-party actions are pinned to a full commit SHA, not a tag. Tags are
#     mutable: if an action's repo is compromised, the attacker can move `v7`
#     to malicious code (this happened with tj-actions/changed-files in 2025).
#     A SHA cannot be moved. The comment after each SHA records the version.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # let every combination finish so we see all failures
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # don't leave the token in .git/config

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=chainsentry --cov-report=term-missing
